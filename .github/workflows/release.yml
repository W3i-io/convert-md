name: Release

# Push a tag like v1.0.0 to build the package, create the GitHub release (notes taken from
# CHANGELOG.md) and, once PyPI is set up (see RELEASING.md), publish to PyPI.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          VERSION=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/convert_md/__init__.py').read_text()).group(1))")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in src/convert_md/__init__.py"; exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'PY'
          import os, re, pathlib
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)", text, re.S | re.M)
          notes = (m.group(1).strip() if m else f"convert-md {version}")
          notes += "\n\n**Install:** download the source code zip below, extract it, and run `install.ps1`. See DEPLOY.md for details."
          pathlib.Path("notes.md").write_text(notes, encoding="utf-8")
          PY
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "convert-md $GITHUB_REF_NAME" --notes-file notes.md

  pypi:
    needs: build
    # Turn on by setting the repository variable PUBLISH_TO_PYPI to "true" (see RELEASING.md).
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/convert-md/
    permissions:
      id-token: write   # trusted publishing; no API token stored in GitHub
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
