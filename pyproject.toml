[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Same name on PyPI, on GitHub and on the command line.
name = "convert-md"
dynamic = ["version"]
description = "Right-click conversion between Markdown and Word, PDF, Excel, PowerPoint and HTML on Windows, using Pandoc and Microsoft MarkItDown."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "W3i" }]
keywords = ["markdown", "pandoc", "markitdown", "docx", "pdf", "xlsx", "pptx", "windows", "context-menu", "converter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
# Keep in step with requirements.txt (a test checks this).
dependencies = [
    "markitdown[docx,pdf,pptx,xlsx,xls,outlook]>=0.1.7,<0.2",
    "pypandoc_binary>=1.17",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.12",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
convert-md = "convert_md.cli:main"

[project.urls]
Homepage = "https://github.com/W3i-io/convert-md"
Documentation = "https://github.com/W3i-io/convert-md/blob/main/DEPLOY.md"
Issues = "https://github.com/W3i-io/convert-md/issues"
Changelog = "https://github.com/W3i-io/convert-md/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "convert_md.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
convert_md = ["*.ahk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
